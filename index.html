    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="mobile-web-app-capable" content="yes" />

      name="description"
      content="منصة ذكاء اصطناعي تحلّل صورك وتحدّد موقعها الجغرافي بدقة في ثوانٍ — الدولة، المدينة، الإحداثيات، والمعالم البارزة."
    />
